<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="title desc" font-family="'Chakra Petch', 'Inter', ui-sans-serif, system-ui, sans-serif">
  <title id="title">OneBrain Harness OS — 4-Layer Architecture</title>
  <desc id="desc">Four stacked layers, top to bottom: OneBrain (plugin and CLI — the OS layer), Harness (Claude Code, Gemini CLI, Codex, Qwen), LLM (local, cloud, or API), and your Markdown vault as the source of truth. Each is a neutral card with a harness-teal accent bar; dashed connectors run between them.</desc>

  <style>
    .flow { animation: flow 0.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -8; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    .lyr-title { font-family: 'Chakra Petch', sans-serif; font-style: italic; font-weight: 700; font-size: 23px; letter-spacing: 0.03em; fill: #f0f0f2; }
    .lyr-no    { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; fill: #00cce0; }
    .lyr-desc  { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; fill: rgba(255,255,255,0.82); }
    .lyr-sub   { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: rgba(255,255,255,0.5); }
    .lyr-tag   { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; fill: rgba(255,255,255,0.28); }
    .lyr-ico   { stroke: #00cce0; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- ══ LAYER 01 — ONEBRAIN ══ -->
  <g transform="translate(30,8)">
    <rect width="700" height="116" fill="#0a0a12" stroke="rgba(255,255,255,0.08)"/>
    <rect width="3" height="116" fill="#00cce0"/>
    <g class="lyr-ico" transform="translate(34,44)">
      <rect x="4" y="4" width="20" height="20" rx="2"/><rect x="10" y="10" width="8" height="8"/>
      <path d="M14 1v3M14 24v3M1 14h3M24 14h3"/>
    </g>
    <text class="lyr-no"    x="80" y="42">LAYER_01</text>
    <text class="lyr-title" x="80" y="72">ONEBRAIN</text>
    <text class="lyr-desc"  x="360" y="52">The OS layer driving every harness.</text>
    <text class="lyr-sub"   x="360" y="76">skills · hooks · memory · indexing · checkpoints</text>
    <text class="lyr-tag"   x="686" y="26" text-anchor="end">OS_LAYER</text>
  </g>
  <line class="flow" x1="380" y1="126" x2="380" y2="140" stroke="#00cce0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"/>

  <!-- ══ LAYER 02 — HARNESS ══ -->
  <g transform="translate(30,144)">
    <rect width="700" height="116" fill="#0a0a12" stroke="rgba(255,255,255,0.08)"/>
    <rect width="3" height="116" fill="#00cce0"/>
    <g class="lyr-ico" transform="translate(34,44)">
      <rect x="3" y="5" width="22" height="18" rx="2"/><path d="M8 11l4 3-4 3M15 17h5"/>
    </g>
    <text class="lyr-no"    x="80" y="42">LAYER_02</text>
    <text class="lyr-title" x="80" y="72">HARNESS</text>
    <text class="lyr-desc"  x="360" y="52">Bring your own. Switch any time.</text>
    <text class="lyr-sub"   x="360" y="76">claude code · gemini cli · codex · qwen</text>
    <text class="lyr-tag"   x="686" y="26" text-anchor="end">BYO_HARNESS</text>
  </g>
  <line class="flow" x1="380" y1="262" x2="380" y2="276" stroke="#00cce0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5" style="animation-delay:0.3s"/>

  <!-- ══ LAYER 03 — LLM ══ -->
  <g transform="translate(30,280)">
    <rect width="700" height="116" fill="#0a0a12" stroke="rgba(255,255,255,0.08)"/>
    <rect width="3" height="116" fill="#00cce0"/>
    <g class="lyr-ico" transform="translate(34,44)">
      <path d="M14 3l2.2 6.2L22.5 11l-6.3 1.8L14 19l-2.2-6.2L5.5 11l6.3-1.8z"/>
    </g>
    <text class="lyr-no"    x="80" y="42">LAYER_03</text>
    <text class="lyr-title" x="80" y="72">LLM</text>
    <text class="lyr-desc"  x="360" y="52">Powered by anything. OneBrain stays the same.</text>
    <text class="lyr-sub"   x="360" y="76">local: mlx, ollama · cloud: claude, gemini, gpt</text>
    <text class="lyr-tag"   x="686" y="26" text-anchor="end">RAW_TOKENS</text>
  </g>
  <line class="flow" x1="380" y1="398" x2="380" y2="412" stroke="#00cce0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5" style="animation-delay:0.6s"/>

  <!-- ══ LAYER 04 — YOUR VAULT ══ -->
  <g transform="translate(30,416)">
    <rect width="700" height="116" fill="#0a0a12" stroke="rgba(255,255,255,0.08)"/>
    <rect width="3" height="116" fill="#00cce0"/>
    <g class="lyr-ico" transform="translate(34,44)">
      <ellipse cx="14" cy="7" rx="9" ry="3.4"/><path d="M5 7v7c0 1.9 4 3.4 9 3.4s9-1.5 9-3.4V7"/><path d="M5 14c0 1.9 4 3.4 9 3.4s9-1.5 9-3.4"/>
    </g>
    <text class="lyr-no"    x="80" y="42">LAYER_04</text>
    <text class="lyr-title" x="80" y="72">YOUR VAULT</text>
    <text class="lyr-desc"  x="360" y="52">Plain Markdown · durable state for every layer.</text>
    <text class="lyr-sub"   x="360" y="76">notes · memory · decisions · knowledge graph</text>
    <text class="lyr-tag"   x="686" y="26" text-anchor="end">BASE_LAYER</text>
  </g>
</svg>
