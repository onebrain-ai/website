<svg xmlns="http://www.w3.org/2000/svg" viewBox="-230 -230 460 460" width="460" height="460" role="img" aria-labelledby="title desc" font-family="'Chakra Petch', 'Inter', ui-sans-serif, system-ui, sans-serif">
  <title id="title">Co-Evolution — four-step loop</title>
  <desc id="desc">Four nodes arranged in a ring, flowing clockwise: 01 INITIALIZE at top, 02 CAPTURE at right, 03 EVOLVE at bottom, 04 WRAPUP at left. Straight arrows connect each node to the next, visualizing the recurring session loop that begins by loading memory and ends by folding new lessons back into it.</desc>

  <style>
    .leg { animation: leg-pulse 5.6s linear infinite; }
    .leg-2 { animation-delay: 1.4s; }
    .leg-3 { animation-delay: 2.8s; }
    .leg-4 { animation-delay: 4.2s; }
    @keyframes leg-pulse {
      0%, 25%, 100% { opacity: 0.5; }
      6%            { opacity: 1; }
    }

    .core-1 { animation: core-breathe 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .core-2 { animation: core-breathe 6s ease-in-out infinite; animation-delay: 1.5s; transform-origin: center; transform-box: fill-box; }
    .core-3 { animation: core-breathe 6s ease-in-out infinite; animation-delay: 3s; transform-origin: center; transform-box: fill-box; }
    .core-4 { animation: core-breathe 6s ease-in-out infinite; animation-delay: 4.5s; transform-origin: center; transform-box: fill-box; }
    @keyframes core-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      .leg, .core-1, .core-2, .core-3, .core-4 { animation: none; opacity: 1; }
      .motion-layer { display: none; }
    }
  </style>

  <defs>
    <marker id="ah-node" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8d000"/>
    </marker>
    <radialGradient id="g-node-fill" cx="0.32" cy="0.32" r="0.85">
      <stop offset="0%"   stop-color="#d4ff45" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a8d000" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Legs: straight lines from edge to edge of adjacent circles, pointing
       at the destination's center so the arrow vector is radial. Ring of
       four nodes (top / right / bottom / left), arrows flow clockwise. -->
  <!-- 01→02 leg (top → right) -->
  <g class="leg">
    <path d="M 36.77 -93.23 L 93.23 -36.77" fill="none" stroke="#a8d000" stroke-width="1.6" marker-end="url(#ah-node)"/>
  </g>
  <!-- 02→03 leg (right → bottom) -->
  <g class="leg leg-2">
    <path d="M 93.23 36.77 L 36.77 93.23" fill="none" stroke="#a8d000" stroke-width="1.6" marker-end="url(#ah-node)"/>
  </g>
  <!-- 03→04 leg (bottom → left) -->
  <g class="leg leg-3">
    <path d="M -36.77 93.23 L -93.23 36.77" fill="none" stroke="#a8d000" stroke-width="1.6" marker-end="url(#ah-node)"/>
  </g>
  <!-- 04→01 leg (left → top) -->
  <g class="leg leg-4">
    <path d="M -93.23 -36.77 L -36.77 -93.23" fill="none" stroke="#a8d000" stroke-width="1.6" marker-end="url(#ah-node)"/>
  </g>

  <!-- Node 01 — INITIALIZE (top) -->
  <g transform="translate(0,-130)">
    <circle class="core-1" cx="0" cy="0" r="52" fill="url(#g-node-fill)"/>
    <text x="0" y="-9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="rgba(10,15,0,0.85)" letter-spacing="0.18em">01</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-style="italic" font-weight="700" font-size="13" letter-spacing="0.04em" fill="#0a0f00">INITIALIZE</text>
  </g>

  <!-- Node 02 — CAPTURE (right) -->
  <g transform="translate(130,0)">
    <circle class="core-2" cx="0" cy="0" r="52" fill="url(#g-node-fill)"/>
    <text x="0" y="-9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="rgba(10,15,0,0.85)" letter-spacing="0.18em">02</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-style="italic" font-weight="700" font-size="14" letter-spacing="0.05em" fill="#0a0f00">CAPTURE</text>
  </g>

  <!-- Node 03 — EVOLVE (bottom) -->
  <g transform="translate(0,130)">
    <circle class="core-3" cx="0" cy="0" r="52" fill="url(#g-node-fill)"/>
    <text x="0" y="-9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="rgba(10,15,0,0.85)" letter-spacing="0.18em">03</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-style="italic" font-weight="700" font-size="14" letter-spacing="0.05em" fill="#0a0f00">EVOLVE</text>
  </g>

  <!-- Node 04 — WRAPUP (left) -->
  <g transform="translate(-130,0)">
    <circle class="core-4" cx="0" cy="0" r="52" fill="url(#g-node-fill)"/>
    <text x="0" y="-9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="rgba(10,15,0,0.85)" letter-spacing="0.18em">04</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-style="italic" font-weight="700" font-size="14" letter-spacing="0.05em" fill="#0a0f00">WRAPUP</text>
  </g>

  <!-- Motion layer: a single lime particle travels each leg, staggered so
       exactly one is in flight at a time — the loop reads as always running
       clockwise. Traversal = 1.4s of a 5.6s cycle; the rest is rest. -->
  <g class="motion-layer">
    <circle r="3.5" fill="#a8d000" opacity="0">
      <animateMotion dur="5.6s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.25;1" repeatCount="indefinite" path="M 36.77 -93.23 L 93.23 -36.77"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#a8d000" opacity="0">
      <animateMotion dur="5.6s" begin="1.4s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.25;1" repeatCount="indefinite" path="M 93.23 36.77 L 36.77 93.23"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="5.6s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#a8d000" opacity="0">
      <animateMotion dur="5.6s" begin="2.8s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.25;1" repeatCount="indefinite" path="M -36.77 93.23 L -93.23 36.77"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="5.6s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#a8d000" opacity="0">
      <animateMotion dur="5.6s" begin="4.2s" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.25;1" repeatCount="indefinite" path="M -93.23 -36.77 L -36.77 -93.23"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="5.6s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
